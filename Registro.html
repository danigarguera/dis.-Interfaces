        <a href="index.html"> <img id="logo" src="Assets/Logo.png" alt="Logo"></a>

        </ul>
    </nav>

    <div id="cuerpo">
        <div id="centro">
            <h2>Formulario de Registro</h2>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellidos" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required>
                </div>

                <div class="input-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-contraseña">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" placeholder="Confirma la contraseña" required>
                </div>

                <button type="submit" class="btn">Registrarse</button>
            </form>
        </div>
    </div>
